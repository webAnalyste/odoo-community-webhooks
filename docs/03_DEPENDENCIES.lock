### Commande de réinstallation

```bash
docker exec -u root odoo-staging pip install \
  'factur-x==7.6' \
  'pyfrctc==0.23' \
  'packaging==26.3' \
  'openupgradelib==3.13.7' \
  unidecode \
  --break-system-packages
```

