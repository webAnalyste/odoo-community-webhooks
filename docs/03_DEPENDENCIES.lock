## Coexistence des 3 branches akretion/l10n-france

Les PR #628, #740 et #810 modifient des répertoires **totalement disjoints** :
- PR #628 : `l10n_fr_account_oca/` uniquement
- PR #740 : `l10n_fr_account_vat_return/` uniquement
- PR #810 : `l10n_fr_account_invoice_import/` + `l10n_fr_account_invoice_import_facturx/`

**Aucun conflit de fichiers** — coexistence possible par copie indépendante de chaque répertoire.
